name: daily_update

on:
  schedule:
    - cron: "30 16 * * 0-4"  # UTC 16:30 (周日~周四) = 北京时间 00:30 (周一~周六)，覆盖全部5个交易日收盘后的次日凌晨更新
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 首次运行含个股日线全量回补（~3.5k 请求），日常只需增量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 中文字体（图表渲染用；runner 通常已预装，此处确保存在）
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Run daily pipeline
        env:
          # 个股日线抓取：并发过高会被新浪按突发窗口限流（2026-09-13 曾致整段队列失败），
          # 故降并发 + 留间隔；脚本内另有限流自适应冷却（连续空响应 → 全局退避）。
          PRICE_WORKERS: "4"
          PRICE_DELAY: "0.1"
        run: python scripts/run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily data update $(date -u +%F)"
            git push
          fi
