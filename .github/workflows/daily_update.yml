name: daily_update

on:
  schedule:
    - cron: "30 16 * * 0-4"  # UTC 16:30 (周日~周四) = 北京时间 00:30 (周一~周六)，覆盖全部5个交易日收盘后的次日凌晨更新
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 上限依据：GitHub-hosted runner 单 job 硬上限 **6 小时（360 分钟）**，超过即被终止，
    # 该上限与仓库可见性无关（public/private 相同）。本仓库为 public 仓库，Actions 分钟数
    # 免费且不限量，故无需为节省额度压缩时长 —— 设为 5 小时，给 6 小时硬上限留 1 小时余量。
    # 抓取阶段另有 PRICE_BUDGET 主动收尾（见下），日常增量运行仅数分钟，用不到本上限。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 中文字体（图表渲染用；runner 通常已预装，此处确保存在）
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Run daily pipeline
        env:
          # 个股日线抓取：并发过高会被新浪按突发窗口限流（2026-09-13 曾致整段队列失败），
          # 故降并发 + 留间隔；脚本内另有限流自适应冷却（连续空响应 → 全局退避）。
          PRICE_WORKERS: "4"
          PRICE_DELAY: "0.1"
          # 全进程请求速率上限（req/s）。限流阈值实测很低：4 线程突发会持续撞限流，
          # 每次撞击换来最长 300s 全局冷却（吞吐归零）——2026-09-15 三轮各只完成 ~500 只。
          # 压到 1 req/s、靠长时间稳定跑量：1×4h = 14400 次请求，远超一轮所需（约 2600）。
          PRICE_RATE: "1.0"
          # 产出停滞多久才收尾（秒）。旧判据是"冷却占已用时长 75%"，导致每轮在约 50 分钟
          # 就中止、只用了 4 小时预算的 22%（2026-09-15 实测 52/52/57 分钟）。
          # 改为看产出：连续 30 分钟零成功抓取才认定限流把本轮压死。
          PRICE_STALL_LIMIT: "1800"
          # 「当日缺价」组单轮配额，防止它（盘中可达 1500+ 只）吃光预算饿死后续各组。
          PRICE_GAP_MAX: "600"
          # 参照日的最小填充比例：避免个别股票先拿到的新日期把参照日顶到数据源
          # 其实还没有的那一天（盘中尤甚），使整轮预算烧在拿不到的数据上。
          PRICE_MIN_DAY_FILL: "0.5"
          # 抓取总时间预算（秒）。用尽即停止取新任务并落盘已完成部分，剩余下次运行继续 ——
          # 2026-09-14 曾因退避遇上持续限流而跑满当时的 timeout-minutes(90) 被 GitHub cancel，
          # 远端零产出（连已抓数据都提交不了）。
          # 设 4 小时：public 仓库分钟免费，放宽后即使限流严重也能一轮抓完全部 3.5k 只
          # （无限流时全量仅约 11 分钟）。必须显著小于 timeout-minutes，其他环节还需时间。
          PRICE_BUDGET: "14400"
        run: python scripts/run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily data update $(date -u +%F)"
            git push
          fi
